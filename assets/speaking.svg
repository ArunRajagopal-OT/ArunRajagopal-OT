<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">Upcoming engagements</title>
  <desc id="desc">Upcoming speaking engagements for Arun Rajagopal: Panelist, Who Owns the Decision?, Industrial Cyber Days, link to follow; and ICS Switzerland Webinar, details to follow.</desc>

  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#2f81f7"/>
      <stop offset="100%" stop-color="#39d0d8"/>
    </linearGradient>
    <linearGradient id="rule" gradientUnits="userSpaceOnUse" x1="52" y1="0" x2="948" y2="0">
      <stop offset="0%" stop-color="#2f81f7"/>
      <stop offset="100%" stop-color="#39d0d8"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#39d0d8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#39d0d8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#39d0d8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="card"><rect width="1000" height="300" rx="18"/></clipPath>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .scan { animation: scan 8s linear infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      .pulse2 { animation: pulse 2.4s ease-in-out 1.2s infinite; }
      .ring { transform-box: fill-box; transform-origin: center; animation: ring 2.4s ease-out infinite; }
      .ring2 { transform-box: fill-box; transform-origin: center; animation: ring 2.4s ease-out 1.2s infinite; }
      .draw { stroke-dasharray: 900; animation: draw 1.8s ease-out 0.3s both; }
      @keyframes scan { 0% { transform: translateY(-120px); } 55%, 100% { transform: translateY(300px); } }
      @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
      @keyframes ring { 0% { transform: scale(1); opacity: 0.55; } 100% { transform: scale(3); opacity: 0; } }
      @keyframes draw { from { stroke-dashoffset: 900; } to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .scan { animation: none; opacity: 0; }
        .pulse, .pulse2 { animation: none; opacity: 1; }
        .ring, .ring2 { animation: none; opacity: 0; }
        .draw { animation: none; stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <rect width="1000" height="300" rx="18" fill="url(#bg)"/>
  <g clip-path="url(#card)">
    <rect class="scan" x="0" y="0" width="1000" height="120" fill="url(#scan)"/>
  </g>
  <rect x="1" y="1" width="998" height="298" rx="17" fill="none" stroke="#30363d"/>

  <!-- restrained industrial-network motif -->
  <g opacity="0.14" stroke="#58a6ff" stroke-width="1.4" fill="none">
    <path d="M560 40 H640 V66 H700"/>
    <circle cx="560" cy="40" r="4" fill="#58a6ff"/>
    <circle cx="700" cy="66" r="4" fill="#58a6ff"/>
  </g>

  <!-- header -->
  <text x="52" y="56" class="mono" font-size="13" fill="#8b949e" letter-spacing="1.6">SPEAKING</text>
  <text x="52" y="88" class="sans" font-size="26" font-weight="700" fill="#f0f6fc" letter-spacing="0.2">Upcoming engagements</text>

  <!-- status chip -->
  <g transform="translate(736 56)">
    <rect width="212" height="34" rx="17" fill="#0d1117" stroke="#30363d"/>
    <circle cx="22" cy="17" r="4" fill="#39d0d8" class="ring"/>
    <circle cx="22" cy="17" r="4" fill="#39d0d8" filter="url(#glow)" class="pulse"/>
    <text x="38" y="21.5" class="mono" font-size="12" fill="#c9d1d9" letter-spacing="1.4">ANNOUNCEMENT SOON</text>
  </g>

  <line x1="52" y1="114" x2="948" y2="114" stroke="url(#rule)" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line class="draw" x1="52" y1="114" x2="948" y2="114" stroke="url(#rule)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- timeline spine -->
  <line x1="76" y1="150" x2="76" y2="238" stroke="#484f58" stroke-width="1.4" stroke-dasharray="3 5"/>

  <!-- engagement 01 -->
  <g>
    <circle cx="76" cy="152" r="5" fill="#0d1117" stroke="#58a6ff" stroke-width="1.6"/>
    <circle cx="76" cy="152" r="2" fill="#58a6ff" class="pulse"/>
    <text x="104" y="146" class="mono" font-size="12" fill="#58a6ff" letter-spacing="1.4">01  ·  PANEL</text>
    <text x="104" y="172" class="sans" font-size="19" font-weight="600" fill="#f0f6fc">Panelist, “Who Owns the Decision?”</text>
    <text x="104" y="194" class="sans" font-size="14" fill="#8b949e">Industrial Cyber Days</text>
    <g transform="translate(780 151)">
      <rect width="168" height="28" rx="14" fill="none" stroke="#30363d"/>
      <text x="84" y="18.5" text-anchor="middle" class="mono" font-size="11.5" fill="#8b949e" letter-spacing="1.1">LINK TO FOLLOW</text>
    </g>
  </g>

  <line x1="104" y1="214" x2="948" y2="214" stroke="#21262d"/>

  <!-- engagement 02 -->
  <g>
    <circle cx="76" cy="240" r="5" fill="#0d1117" stroke="#39d0d8" stroke-width="1.6"/>
    <circle cx="76" cy="240" r="2" fill="#39d0d8" class="pulse2"/>
    <text x="104" y="236" class="mono" font-size="12" fill="#39d0d8" letter-spacing="1.4">02  ·  WEBINAR</text>
    <text x="104" y="262" class="sans" font-size="19" font-weight="600" fill="#f0f6fc">ICS Switzerland Webinar</text>
    <g transform="translate(780 241)">
      <rect width="168" height="28" rx="14" fill="none" stroke="#30363d"/>
      <text x="84" y="18.5" text-anchor="middle" class="mono" font-size="11.5" fill="#8b949e" letter-spacing="1.1">DETAILS TO FOLLOW</text>
    </g>
  </g>
</svg>
