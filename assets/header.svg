<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img" aria-labelledby="title desc">
  <title id="title">Arun Rajagopal</title>
  <desc id="desc">Animated technical profile header for Arun Rajagopal.</desc>

  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#2f81f7"/>
      <stop offset="100%" stop-color="#39d0d8"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="270" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="998" height="268" rx="17" fill="none" stroke="#30363d"/>

  <!-- restrained industrial-network motif -->
  <g opacity="0.17" stroke="#58a6ff" stroke-width="1.4" fill="none">
    <path d="M55 70 H165 V40 H250"/>
    <path d="M55 198 H150 V226 H250"/>
    <path d="M750 42 H845 V78 H945"/>
    <path d="M750 226 H855 V192 H945"/>
    <circle cx="55" cy="70" r="4" fill="#58a6ff"/>
    <circle cx="250" cy="40" r="4" fill="#58a6ff"/>
    <circle cx="55" cy="198" r="4" fill="#58a6ff"/>
    <circle cx="250" cy="226" r="4" fill="#58a6ff"/>
    <circle cx="750" cy="42" r="4" fill="#58a6ff"/>
    <circle cx="945" cy="78" r="4" fill="#58a6ff"/>
    <circle cx="750" cy="226" r="4" fill="#58a6ff"/>
    <circle cx="945" cy="192" r="4" fill="#58a6ff"/>
  </g>

  <text x="500" y="78" text-anchor="middle" fill="#f0f6fc" font-size="36" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" letter-spacing="0.6">ARUN RAJAGOPAL</text>
  <rect x="360" y="96" width="280" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="500" y="129" text-anchor="middle" fill="#c9d1d9" font-size="16" font-family="Inter,Segoe UI,Arial,sans-serif" letter-spacing="0.3">Principal Cybersecurity Advisor &amp; Architect</text>

  <!-- rotating technical identity: one subtle animation -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" text-anchor="middle">
    <text x="500" y="174" fill="#58a6ff" opacity="0">&gt; OT CYBERSECURITY ARCHITECT
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.28;0.33;1" dur="12s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="500" y="174" fill="#58a6ff" opacity="0">&gt; IEC 62443 SPECIALIST
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.32;0.37;0.61;0.66;1" dur="12s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="500" y="174" fill="#58a6ff" opacity="0">&gt; INDUSTRIAL SYSTEMS ENGINEER
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.65;0.70;0.94;1" dur="12s" begin="0s" repeatCount="indefinite"/>
    </text>
  </g>

  <text x="500" y="221" text-anchor="middle" fill="#8b949e" font-size="14" font-family="Inter,Segoe UI,Arial,sans-serif">OT Security  ·  Critical Infrastructure  ·  Industrial Systems  ·  Secure-by-Design</text>

  <circle cx="817" cy="221" r="3.2" fill="#39d0d8" filter="url(#glow)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/>
  </circle>
</svg>