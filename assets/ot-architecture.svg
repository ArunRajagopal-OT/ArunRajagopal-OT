<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">OT security architecture</title>
  <desc id="desc">A simplified industrial cybersecurity architecture showing enterprise, DMZ, OT, PLC, safety and field zones with a controlled signal moving through the permitted path.</desc>

  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <rect width="1000" height="430" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="998" height="428" rx="17" fill="none" stroke="#30363d"/>

  <text x="55" y="50" fill="#f0f6fc" font-size="22" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">OT SECURITY ARCHITECTURE</text>
  <text x="55" y="76" fill="#8b949e" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">ZONES · CONDUITS · SEGMENTATION · CONTROLLED ACCESS</text>

  <!-- main architecture path -->
  <g stroke="#30363d" stroke-width="2.2" fill="none">
    <path d="M500 120 V156"/>
    <path d="M500 210 V246"/>
    <path d="M500 300 V326 H310 V345"/>
    <path d="M500 326 H690 V345"/>
    <path d="M310 393 V410"/>
  </g>

  <!-- permitted conduit overlay -->
  <path id="flowPath" d="M500 108 V180 V273 V326 H310 V372 V410" fill="none" stroke="#58a6ff" stroke-width="2.4" stroke-dasharray="7 8" opacity="0.55" marker-end="url(#arrow)"/>

  <!-- zones -->
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g>
      <rect x="365" y="90" width="270" height="58" rx="10" fill="#161b22" stroke="#3b82f6" stroke-width="1.4"/>
      <text x="500" y="115" text-anchor="middle" fill="#f0f6fc" font-size="16" font-weight="700">ENTERPRISE / IT</text>
      <text x="500" y="135" text-anchor="middle" fill="#8b949e" font-size="12">Business systems and authorised services</text>
    </g>

    <g>
      <rect x="400" y="164" width="200" height="46" rx="9" fill="#161b22" stroke="#8b949e"/>
      <text x="500" y="193" text-anchor="middle" fill="#c9d1d9" font-size="15" font-weight="700">INDUSTRIAL DMZ</text>
    </g>

    <g>
      <rect x="340" y="254" width="320" height="46" rx="9" fill="#161b22" stroke="#39d0d8" stroke-width="1.4"/>
      <text x="500" y="282" text-anchor="middle" fill="#f0f6fc" font-size="15" font-weight="700">OT / SCADA ZONE</text>
    </g>

    <g>
      <rect x="225" y="345" width="170" height="48" rx="9" fill="#161b22" stroke="#58a6ff"/>
      <text x="310" y="374" text-anchor="middle" fill="#c9d1d9" font-size="14" font-weight="700">PLC / CONTROL</text>
    </g>

    <g>
      <rect x="605" y="345" width="170" height="48" rx="9" fill="#161b22" stroke="#58a6ff"/>
      <text x="690" y="374" text-anchor="middle" fill="#c9d1d9" font-size="14" font-weight="700">SAFETY / SIS</text>
    </g>

    <text x="310" y="422" text-anchor="middle" fill="#8b949e" font-size="12">FIELD ASSETS</text>
  </g>

  <!-- security controls -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#8b949e">
    <text x="525" y="158">firewall</text>
    <text x="525" y="246">inspection / policy</text>
    <text x="710" y="324">segmented conduit</text>
  </g>

  <!-- moving signal: restrained single animation -->
  <circle r="5" fill="#39d0d8" filter="url(#softGlow)">
    <animateMotion dur="8s" repeatCount="indefinite" rotate="auto">
      <mpath href="#flowPath"/>
    </animateMotion>
    <animate attributeName="opacity" values="0.45;1;0.45" dur="1.4s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(760 105)" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">
    <circle cx="0" cy="0" r="4" fill="#39d0d8"/>
    <text x="12" y="4" fill="#8b949e">CONTROLLED SIGNAL FLOW</text>
  </g>
</svg>